<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="입력 큐 소비와 방향 전환 도식">
<rect x="0.5" y="0.5" width="819" height="399" rx="10" fill="#f7f8fa" stroke="#dfe3e8"/>

<text x="32" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" fill="#333a45">입력 큐 소비와 방향 전환 &#8212; 전환은 항상 격자 경계에서 일어납니다</text>
<text x="32" y="52" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="11" fill="#6b7480">칸을 하나 지날 때마다 ProcessInputQueue()가 큐에서 입력을 하나만 꺼내 방향을 바꿉니다</text>

<!-- input queue panel -->
<text x="40" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7480">_inputQueue (경계 도달 직전)</text>
<rect x="40.5" y="88.5" width="38" height="30" fill="#f0b429" stroke="#cf9316"/>
<text x="59" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#333a45">DOWN</text>
<rect x="80.5" y="88.5" width="38" height="30" fill="#ffffff" stroke="#d5dae1" stroke-dasharray="3,2"/>
<rect x="120.5" y="88.5" width="38" height="30" fill="#ffffff" stroke="#d5dae1" stroke-dasharray="3,2"/>
<text x="40" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9aa4b2">front</text>

<path d="M175 103 L215 103" stroke="#333a45" stroke-width="1.5" fill="none"/>
<polygon points="220,103 212,98 212,108" fill="#333a45"/>
<text x="197" y="93" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#6b7480">pop()</text>

<text x="230" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7480">경계 통과 직후</text>
<rect x="230.5" y="88.5" width="38" height="30" fill="#ffffff" stroke="#d5dae1" stroke-dasharray="3,2"/>
<rect x="270.5" y="88.5" width="38" height="30" fill="#ffffff" stroke="#d5dae1" stroke-dasharray="3,2"/>
<rect x="310.5" y="88.5" width="38" height="30" fill="#ffffff" stroke="#d5dae1" stroke-dasharray="3,2"/>
<text x="230" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9aa4b2">비어 있음</text>

<text x="410" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#333a45">SetDirection(DOWN)</text>
<text x="410" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#333a45">_canTurn = false</text>
<path d="M380 100 L400 100" stroke="#333a45" stroke-width="1.5" fill="none"/>
<polygon points="405,100 397,95 397,105" fill="#333a45"/>

<text x="40" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9aa4b2">PushInput() — 게임 스레드가 아닌 다른 시점에도 언제든 큐에 쌓일 수 있습니다</text>

<!-- connector down to the turn point -->
<line x1="59" y1="119" x2="59" y2="160" stroke="#c9d0da" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="59" y1="160" x2="240" y2="160" stroke="#c9d0da" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="240" y1="160" x2="240" y2="221" stroke="#c9d0da" stroke-width="1" stroke-dasharray="3,3"/>

<!-- 2D grid (faint mesh) -->
<g stroke="#e3e6ea" stroke-width="1" stroke-dasharray="2,4">
<line x1="80" y1="170" x2="80" y2="350"/>
<line x1="140" y1="170" x2="140" y2="350"/>
<line x1="200" y1="170" x2="200" y2="350"/>
<line x1="240" y1="170" x2="240" y2="350"/>
<line x1="300" y1="170" x2="300" y2="350"/>
<line x1="80" y1="170" x2="300" y2="170"/>
<line x1="80" y1="230" x2="300" y2="230"/>
<line x1="80" y1="290" x2="300" y2="290"/>
<line x1="80" y1="350" x2="300" y2="350"/>
</g>
<text x="310" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7480">x &#8594;</text>
<text x="64" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7480">y</text>
<text x="66" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7480">&#8595;</text>

<!-- path: right, right, turn down, down -->
<path d="M80 230 L140 230 L240 230 L240 290 L240 350" fill="none" stroke="#333a45" stroke-width="2.5"/>
<polygon points="240,358 234,346 246,346" fill="#333a45"/>

<!-- markers -->
<circle cx="80" cy="230" r="5" fill="#ffffff" stroke="#333a45" stroke-width="2"/>
<text x="80" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#333a45">시작</text>

<circle cx="140" cy="230" r="4.5" fill="#ffffff" stroke="#9aa4b2" stroke-width="2"/>
<text x="140" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9aa4b2">AddTrail</text>

<polygon points="240,222 248,230 240,238 232,230" fill="#f0b429" stroke="#cf9316" stroke-width="1.5"/>
<text x="256" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#333a45">&#9670; 전환 지점</text>

<circle cx="240" cy="290" r="4.5" fill="#ffffff" stroke="#9aa4b2" stroke-width="2"/>
<text x="256" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#9aa4b2">AddTrail (방향 유지)</text>

<circle cx="240" cy="350" r="5" fill="#ffffff" stroke="#333a45" stroke-width="2"/>
<text x="256" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#333a45">현재 위치</text>

<!-- legend -->
<circle cx="440" cy="222" r="4.5" fill="#ffffff" stroke="#9aa4b2" stroke-width="2"/>
<text x="452" y="226" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="12" fill="#333a45">경계 통과 &#8212; 큐가 비어 있어 방향 유지</text>
<polygon points="440,254 447,261 440,268 433,261" fill="#f0b429" stroke="#cf9316" stroke-width="1.5"/>
<text x="452" y="258" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="12" fill="#333a45">경계 통과 &#8212; 큐에서 pop, SetDirection() 호출</text>
<text x="452" y="274" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" font-size="12" fill="#333a45">(방향 전환은 이 지점에서만 일어납니다)</text>
</svg>
