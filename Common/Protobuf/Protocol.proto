syntax = "proto3";

package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
		
}

message S_LOGIN
{
	bool success = 1;
	User user = 2; // 아이디 발급 전
}

message C_ENTER_GAME
{

}

message S_ENTER_GAME
{
	bool success = 1;
	PlayerInfo player = 2;
}

message S_SPAWN_ACTOR
{
	uint64 id = 1;
	Vector2 spawnPos = 2;
}

message C_MOVE_ACTOR
{
	DirectionType newdir = 1; 
}

message S_UPDATE_ROOM
{
	repeated ActorInfo actors = 1;
}
