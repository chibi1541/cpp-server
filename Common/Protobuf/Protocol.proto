syntax = "proto3";

package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string name = 1;
}

message S_LOGIN
{
	bool success = 1;
	User user = 2;
}

message C_ENTER_GAME
{

}

message S_ENTER_GAME
{
	bool success = 1;
	uint32 needplayer = 2;
	uint32 width = 3;
	uint32 height = 4;
	repeated PlayerInfo players = 5;
}

message C_EXIT_GAME
{
	
}

message S_START_GAME
{
	bool success = 1;
	uint32 counttime = 2;
}

message S_SPAWN_ACTOR
{
	uint64 id = 1;
	Vector2 spawnPos = 2;
}

message S_SPAWN_PLAYER
{
	PlayerInfo player = 1;
}

message C_MOVE_ACTOR
{
	DirectionType newdir = 1; 
}

message S_UPDATE_ROOM
{
	repeated PlayerInfo players = 1;
	repeated FieldData fieldData = 2;
}

message S_DESTROY_ACTOR
{
	uint64 id = 1;
}

message S_GAME_RESULT
{
	uint64 winplayerid = 1;
}
