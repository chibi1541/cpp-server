// .proto 버전
syntax = "proto3";

// package name
package Protocol;

import "Enum.proto";

message User
{
	uint64 id = 1;
	string name = 2;
}

message Vector2
{
	int32 x = 1;
	int32 y = 2;
}

message ActorInfo
{
	uint64 objectId = 1;
	Vector2 pos = 2;
}

message PlayerInfo
{
	uint64 id = 1;
	string name = 2;
	ActorInfo actor = 3;
}